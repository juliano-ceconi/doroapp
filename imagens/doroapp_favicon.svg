<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Filtro de sombra projetada para visibilidade em temas claro/escuro -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Orelha Traseira (levemente escura para dar profundidade) -->
    <path d="M 48 40 C 47 26, 53 18, 56 18 C 59 18, 59 28, 53 44 Z" fill="#cccccc" />
    
    <!-- Orelha Frontal -->
    <path d="M 42 38 C 40 22, 46 14, 49 14 C 52 14, 53 26, 47 42 Z" fill="#ffffff" />
    
    <!-- Cabeça -->
    <circle cx="38" cy="48" r="13" fill="#ffffff" />
    
    <!-- Corpo e Coxa Traseira combinados -->
    <path d="M 37 54 C 46 52, 68 57, 68 74 C 68 84, 58 84, 48 84 C 38 84, 35 77, 35 77 Z" fill="#ffffff" />
    
    <!-- Pata Dianteira -->
    <rect x="36" y="72" width="7" height="13" rx="3.5" fill="#ffffff" />
    
    <!-- Pata Traseira -->
    <rect x="50" y="77" width="18" height="8" rx="4" fill="#ffffff" />
    
    <!-- Cauda Pompom -->
    <circle cx="71" cy="71" r="6.5" fill="#ffffff" />
  </g>
</svg>
