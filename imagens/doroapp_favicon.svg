<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Filtro de sombra projetada, garantindo excelente visibilidade tanto em abas de navegadores claras quanto escuras -->
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Orelha Traseira (sombreada para profundidade tridimensional) -->
    <path d="M 43 33 C 46 31, 51 18, 57 10 C 59 18, 57 28, 52 37 Z" fill="#b3b3b3" />
    
    <!-- Coelho Principal (Silhueta Contínua em Branco Puro) -->
    <path d="M 23 75
             C 21 70, 21 62, 23 55
             C 25 48, 31 42, 37 42
             C 40 42, 41 38, 40 32
             C 38 23, 35 12, 42 5
             C 45 12, 46 22, 43 33
             C 45 38, 47 42, 52 37
             C 63 43, 71 52, 71 66
             C 71 68, 75 66, 77 69
             C 79 72, 77 75, 73 75
             C 67 75, 65 75, 59 75
             C 55 75, 53 70, 53 66
             C 53 58, 45 56, 39 56
             C 33 56, 31 68, 30 75 Z" fill="#ffffff" />
  </g>
</svg>
